name: Fetch upstream over Reticulum

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Build and test run ID (blank selects latest successful main run)
        type: string
      gateway:
        description: Public TCP Reticulum gateway with a route to upstream
        type: string
        default: reticulum.thecryptosquid.com
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: upstream-reference
  cancel-in-progress: false

jobs:
  fetch:
    name: Native rngit / hosted upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.build_run }}
      GATEWAY: ${{ inputs.gateway || 'reticulum.thecryptosquid.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET for C# test fixtures
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download a verified native Build artifact
        run: |
          $run = $env:BUILD_RUN
          if (!$run) {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci-build-test.yml --branch main --status success --limit 1 --json databaseId
            if ($LASTEXITCODE -ne 0) { throw 'Could not find a successful native build.' }
            $run = ($runs | ConvertFrom-Json)[0].databaseId
          }
          if ("$run" -notmatch '^\d+$') { throw 'A numeric successful Build run ID is required.' }
          $metadata = gh run view $run --repo $env:GITHUB_REPOSITORY --json headSha,conclusion,headBranch,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.conclusion -ne 'success' -or $metadata.headBranch -ne 'main' -or $metadata.workflowName -ne 'Build and test') {
            throw 'The selected run must be a successful main Build and test run.'
          }
          gh run download $run --repo $env:GITHUB_REPOSITORY --name native-linux-x64 --dir artifacts/native
          if ($LASTEXITCODE -ne 0) { throw 'Native build download failed.' }
          ./tests/use-native-build.ps1 -Directory artifacts/native -Rid linux-x64 -Commit $metadata.headSha

      - name: Retrieve missing upstream objects using our native rngit
        run: ./tests/fetch-reference.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Directory "$env:RUNNER_TEMP/hosted-reference" -Gateway $env:GATEWAY

      - name: Verify the pinned Python environment from fetched objects
        run: ./tests/prepare-reference.ps1 -Bundle "$env:RUNNER_TEMP/hosted-reference/reference.bundle" -Directory "$env:RUNNER_TEMP/pinned-python" -Python python3

      - name: Run native contract integration with actual pinned Python peers
        id: compatibility
        continue-on-error: true
        run: |
          ./tests/install-pester.ps1
          ./tests/run-contract-integration.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Label 'linux-x64, Reticulum-fetched reference' -NoJobSummary

      - name: Execute shared pinned advertised-claim scenarios
        run: |
          $pin = (Get-Content tests/Compatibility/catalog.json -Raw | ConvertFrom-Json).reference.revision
          ./tests/compare-upstream.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Python $env:DOTRETICULUM_PYTHON -Upstream $env:DOTRETICULUM_UPSTREAM -Revision $pin -OutputDirectory TestResults/upstream-pinned -Label 'Pinned advertised-claim comparison'
          Copy-Item -LiteralPath TestResults/upstream-pinned/upstream.json -Destination "$env:RUNNER_TEMP/hosted-reference/upstream.json"

      - name: Compare retrieved upstream head with the native implementation
        run: |
          $provenance = Get-Content -LiteralPath "$env:RUNNER_TEMP/hosted-reference/reference-provenance.json" -Raw | ConvertFrom-Json
          git -C $env:DOTRETICULUM_UPSTREAM checkout --detach $provenance.head
          if ($LASTEXITCODE -ne 0) { throw 'Could not materialize retrieved head for drift comparison.' }
          ./tests/compare-upstream.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Python $env:DOTRETICULUM_PYTHON -Upstream $env:DOTRETICULUM_UPSTREAM -Revision $provenance.head -OutputDirectory TestResults/upstream-head

      - name: Propagate pinned integration failure
        if: ${{ !cancelled() && steps.compatibility.outcome == 'failure' }}
        run: throw 'Pinned integration failed; see retained reports.'

      - name: Retain verified reference and provenance
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pinned-reference
          path: |
            ${{ runner.temp }}/hosted-reference/reference.bundle
            ${{ runner.temp }}/hosted-reference/reference-provenance.json
            ${{ runner.temp }}/hosted-reference/upstream.json
          if-no-files-found: warn
          retention-days: 30

      - name: Retain compatibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-reference-compatibility
          path: |
            TestResults/contract-integration/
            TestResults/upstream-head/
            TestResults/upstream-pinned/
          if-no-files-found: warn
          retention-days: 30
