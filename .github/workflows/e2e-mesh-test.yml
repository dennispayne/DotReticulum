name: Repeated mixed-mesh acceptance

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      iterations:
        description: Mixed-mesh repetitions (1-10, failures remain failures)
        type: number
        default: 3

permissions:
  contents: read
  actions: read

concurrency:
  group: mixed-mesh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/ci-build-test.yml
    with:
      extended_suite: mesh
      iterations: ${{ github.event_name == 'schedule' && 3 || inputs.iterations }}
