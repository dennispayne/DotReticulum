name: Build, test and NativeAOT

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'DotReticulum.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '!**/*.md'
      - '!docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'DotReticulum.sln'
      - 'Directory.Build.props'
      - 'global.json'
      - '!**/*.md'
      - '!docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-aot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore DotReticulum.sln
      - name: Test with coverage
        run: dotnet test DotReticulum.sln -c Release --no-restore --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
      - name: Publish native executable
        run: dotnet publish src/DotReticulum.Applications/DotReticulum.Applications.csproj -c Release -r ${{ matrix.rid }} -o artifacts/${{ matrix.rid }} -p:ILLinkTreatWarningsAsErrors=true -p:IlcTreatWarningsAsErrors=true
      - name: Smoke test native executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            artifacts/${{ matrix.rid }}/DotReticulum.Applications.exe --help
          else
            artifacts/${{ matrix.rid }}/DotReticulum.Applications --help
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          if-no-files-found: warn
