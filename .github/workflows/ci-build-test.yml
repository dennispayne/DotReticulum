name: Build and test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'DotReticulum.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'
      - '.editorconfig'
      - '!**/*.md'
      - '!docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'DotReticulum.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'
      - '.editorconfig'
      - '!**/*.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y clang zlib1g-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore DotReticulum.slnx

      - name: Build
        run: dotnet build DotReticulum.slnx -c Release --no-restore

      - name: Publish NativeAOT
        run: |
          $publish = @('publish', 'src/DotReticulum.Applications/DotReticulum.Applications.csproj',
            '-c', 'Release', '-r', '${{ matrix.rid }}',
            '-p:ILLinkTreatWarningsAsErrors=true', '-p:IlcTreatWarningsAsErrors=true',
            '-o', 'artifacts/native')
          if ($IsWindows) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
            $env:PATH = "$installer;$env:PATH"
            $installation = & (Join-Path $installer 'vswhere.exe') -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$installation) { throw 'MSVC NativeAOT tools are unavailable.' }
            $setup = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
            & $env:ComSpec /c "call `"$setup`" >nul && dotnet $($publish -join ' ')"
          } else {
            dotnet @publish
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test and write build manifest
        run: |
          $executable = if ($IsWindows) { 'DotReticulum.Applications.exe' } else { 'DotReticulum.Applications' }
          & (Join-Path $PWD "artifacts/native/$executable") --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{ commit = $env:GITHUB_SHA; rid = '${{ matrix.rid }}'; executable = $executable } |
            ConvertTo-Json | Set-Content -LiteralPath artifacts/native/build-manifest.json -Encoding utf8

      - name: Upload native build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    needs: [build, compatibility]
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    env:
      DOTRETICULUM_LIVE: '0'
      COVERAGE_DIRECTORY: TestResults/coverage-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download native build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native

      - name: Verify native build
        run: ./tests/use-native-build.ps1 -Directory artifacts/native -Rid ${{ matrix.rid }}

      - name: Reuse the candidate-fetched reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: reference-source-${{ github.run_attempt }}
          path: artifacts/reference

      - name: Provision pinned Python peers for integration
        run: |
          $directory = Join-Path $PWD 'artifacts/reference'
          $bundle = Join-Path $directory 'reference.bundle'
          if (Test-Path -LiteralPath $bundle) {
            $python = if ($IsWindows) { 'python' } else { 'python3' }
            ./tests/prepare-reference.ps1 -Bundle $bundle -Directory (Join-Path $env:RUNNER_TEMP 'pinned-python') -Python $python
          } else {
            Write-Warning 'Candidate retrieval produced no reference bundle; Python-peer integration cases will be explicitly unexecuted.'
          }

      - name: Restore
        run: dotnet restore DotReticulum.slnx

      - name: Build
        id: build
        run: dotnet build DotReticulum.slnx -c Release --no-restore

      - name: Unit tests with production coverage
        run: |
          if (Test-Path -LiteralPath $env:COVERAGE_DIRECTORY) { throw 'Coverage directory must be fresh.' }
          dotnet test DotReticulum.slnx -c Release --no-build -m:1 --filter 'Category=Unit' --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory "$env:COVERAGE_DIRECTORY/unit" --logger trx -- xUnit.MaxParallelThreads=1

      - name: Integration tests with production coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test DotReticulum.slnx -c Release --no-build -m:1 --filter 'Category!=Unit&Category!=Live' --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory "$env:COVERAGE_DIRECTORY/integration" --logger trx -- xUnit.MaxParallelThreads=1

      - name: Summarize unit test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/test_summary.ps1 -Path "$env:COVERAGE_DIRECTORY/unit" -Title 'Unit tests (${{ matrix.rid }})' -JsonPath TestResults/summary-unit.json
          $summary

      - name: Summarize integration test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/test_summary.ps1 -Path "$env:COVERAGE_DIRECTORY/integration" -Title 'Integration tests (${{ matrix.rid }})' -JsonPath TestResults/summary-integration.json
          $summary

      - name: Summarize merged coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/coverage_summary.ps1 $env:COVERAGE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary

      - name: Run native executable resource flow
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: dotnet test tests/DotReticulum.Applications.Tests/DotReticulum.Applications.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~NativeResourceTests' --results-directory TestResults/native --logger trx -- xUnit.MaxParallelThreads=1

      - name: Run native CLI and installation checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./tests/install-pester.ps1
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Container = @('Coverage', 'Parity8Packaging') | ForEach-Object {
            New-PesterContainer -Path "tests/Pester/$_.Tests.ps1" -Data @{ Application = $env:DOTRETICULUM_NATIVE_EXE }
          }
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'TestResults/native-cli.xml'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed' -or $result.PassedCount -eq 0) { exit 1 }

      - name: Run native contract integration and mixed-peer checks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./tests/run-contract-integration.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Label '${{ matrix.rid }}' -NoJobSummary

      - name: Summarize native test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/test_summary.ps1 -Path TestResults/native, TestResults/native-cli.xml, TestResults/contract-integration/contract-integration.xml -Title 'Native executable and contract integration tests (${{ matrix.rid }})' -JsonPath TestResults/summary-native.json
          $summary

      - name: Retain test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.rid }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Compatibility
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download native build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native

      - name: Verify native build
        run: ./tests/use-native-build.ps1 -Directory artifacts/native -Rid ${{ matrix.rid }}

      - name: Run shared scenarios, retrieving the reference with this native candidate
        run: |
          ./tests/run-compatibility.ps1 -Application $env:DOTRETICULUM_NATIVE_EXE -Implementation DotReticulum -FetchReference -ReferenceDirectory "$env:RUNNER_TEMP/candidate-reference" -Label '${{ matrix.rid }}' -NoJobSummary

      - name: Retain one verified reference source bundle for this run
        if: ${{ !cancelled() && matrix.rid == 'linux-x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-source-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-reference/reference.bundle
            ${{ runner.temp }}/candidate-reference/reference-provenance.json
          if-no-files-found: warn
          retention-days: 14

      - name: Retain compatibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-${{ matrix.rid }}-${{ github.run_attempt }}
          path: TestResults/compatibility/
          if-no-files-found: warn
          retention-days: 14

  upstream-baseline:
    name: Compatibility / Upstream
    needs: compatibility
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reuse the candidate-fetched reference
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reference-source-${{ github.run_attempt }}
          path: artifacts/reference

      - name: Provision the verified pinned reference
        run: ./tests/prepare-reference.ps1 -Bundle artifacts/reference/reference.bundle -Directory "$env:RUNNER_TEMP/pinned-python" -Python python3

      - name: Execute the same shared scenarios with upstream as the candidate
        run: ./tests/run-compatibility.ps1 -Implementation Upstream -ReferenceDirectory artifacts/reference -NoJobSummary

      - name: Retain upstream baseline evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-upstream-${{ github.run_attempt }}
          path: TestResults/compatibility/
          if-no-files-found: warn
          retention-days: 14

  compatibility-summary:
    name: Summarize Compatibility
    needs: [compatibility, upstream-baseline]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: compatibility-*-${{ github.run_attempt }}
          path: TestResults/compatibility-platforms

      - name: Summarize all contract rows across platforms
        run: |
          $directory = 'TestResults/compatibility-platforms'
          $null = New-Item -ItemType Directory -Force -Path $directory
          $summary = & ./tests/compatibility_summary.ps1 -ReportsDirectory $directory
          $summary
          $summary | Set-Content -LiteralPath TestResults/compatibility-all-platforms.md -Encoding utf8
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

  test-summary:
    name: Summarize Test
    needs: test
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform test summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*-${{ github.run_attempt }}
          path: TestResults/test-platforms

      - name: Summarize tests across platforms
        run: |
          $directory = 'TestResults/test-platforms'
          $null = New-Item -ItemType Directory -Force -Path $directory
          $summary = & ./tests/test_platform_summary.ps1 -ReportsDirectory $directory
          $summary
          $summary | Set-Content -LiteralPath TestResults/tests-all-platforms.md -Encoding utf8
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
