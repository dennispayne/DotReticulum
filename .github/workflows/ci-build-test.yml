name: Build and test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'DotReticulum.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'
      - '.editorconfig'
      - '!**/*.md'
      - '!docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'DotReticulum.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'
      - 'global.json'
      - '.editorconfig'
      - '!**/*.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTRETICULUM_LIVE: '0'
      COVERAGE_DIRECTORY: TestResults/coverage-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y clang zlib1g-dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore DotReticulum.slnx

      - name: Build
        id: build
        run: dotnet build DotReticulum.slnx -c Release --no-restore

      - name: Test with production coverage
        run: |
          if (Test-Path -LiteralPath $env:COVERAGE_DIRECTORY) { throw 'Coverage directory must be fresh.' }
          dotnet test DotReticulum.slnx -c Release --no-build -m:1 --settings tests/coverage.runsettings --collect:"XPlat Code Coverage" --results-directory $env:COVERAGE_DIRECTORY --logger trx -- xUnit.MaxParallelThreads=1

      - name: Summarize test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/test_summary.ps1 -Path $env:COVERAGE_DIRECTORY -Title 'Unit and integration tests (${{ matrix.rid }})'
          $summary
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Summarize merged coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $summary = & ./tests/coverage_summary.ps1 $env:COVERAGE_DIRECTORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $summary
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Publish NativeAOT
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $publish = @('publish', 'src/DotReticulum.Applications/DotReticulum.Applications.csproj',
            '-c', 'Release', '-r', '${{ matrix.rid }}',
            '-p:ILLinkTreatWarningsAsErrors=true', '-p:IlcTreatWarningsAsErrors=true',
            '-o', 'artifacts/native')
          if ($IsWindows) {
            $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer'
            $env:PATH = "$installer;$env:PATH"
            $installation = & (Join-Path $installer 'vswhere.exe') -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$installation) { throw 'MSVC NativeAOT tools are unavailable.' }
            $setup = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
            & $env:ComSpec /c "call `"$setup`" >nul && dotnet $($publish -join ' ')"
          } else {
            dotnet @publish
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Join-Path $PWD $(if ($IsWindows) { 'artifacts/native/DotReticulum.Applications.exe' } else { 'artifacts/native/DotReticulum.Applications' })
          "DOTRETICULUM_NATIVE_EXE=$binary" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Run native help and encrypted resource flow
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          & $env:DOTRETICULUM_NATIVE_EXE --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/DotReticulum.Applications.Tests/DotReticulum.Applications.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~NativeResourceTests' --results-directory TestResults/native --logger trx -- xUnit.MaxParallelThreads=1

      - name: Run native CLI and installation checks
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          if (!(Get-Module -ListAvailable Pester | Where-Object Version -eq '5.7.1')) {
            for ($attempt = 1; ; $attempt++) {
              try {
                if (!(Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
                Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck -Repository PSGallery -ErrorAction Stop
                break
              } catch {
                if ($attempt -ge 4) { throw }
                Write-Warning "Pester install attempt $attempt failed: $($_.Exception.Message)"
                Start-Sleep -Seconds (10 * $attempt)
              }
            }
          }
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Container = @('Coverage', 'Cli', 'Parity8Packaging') | ForEach-Object {
            New-PesterContainer -Path "tests/Pester/$_.Tests.ps1" -Data @{ Application = $env:DOTRETICULUM_NATIVE_EXE }
          }
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'TestResults/native-cli.xml'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed' -or $result.PassedCount -eq 0) { exit 1 }

      - name: Summarize native test results
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          $summary = & ./tests/test_summary.ps1 -Path TestResults/native, TestResults/native-cli.xml -Title 'Native executable tests (${{ matrix.rid }})'
          $summary
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Retain test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.rid }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
