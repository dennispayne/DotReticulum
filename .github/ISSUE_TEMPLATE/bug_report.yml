name: Bug report
description: Report a reproducible defect or protocol incompatibility
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Revision, OS, architecture, .NET version, and Python RNS version if applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected behavior
      description: Include minimal steps and sanitized logs. Never share private identity keys.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
